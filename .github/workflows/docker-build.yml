name: Build and Push Docker Images

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: densify/container-optimization-data-forwarder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract tag name and determine if official release
        id: extract_tag
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # remove leading 'v' from semver tags (e.g. v4.2.3-alpha -> 4.2.3-alpha)
          tag=$(echo "${tag}" | sed -E 's/^v([0-9]+.*)$/\1/')
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          
          # Check if this is an official release (not alpha, beta, rc, etc.)
          if [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_official=true" >> $GITHUB_OUTPUT
            # Extract major version (e.g., 4.2.2 -> 4)
            major_version=$(echo "${tag}" | sed -E 's/^([0-9]+)\.[0-9]+\.[0-9]+$/\1/')
            echo "major_version=${major_version}" >> $GITHUB_OUTPUT
          else
            echo "is_official=false" >> $GITHUB_OUTPUT
            echo "major_version=" >> $GITHUB_OUTPUT
          fi

      - name: Get commit SHA
        id: get_sha
        run: echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=alpine-${{ steps.extract_tag.outputs.tag }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ steps.extract_tag.outputs.tag }}
            ${{ steps.extract_tag.outputs.is_official == 'true' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.extract_tag.outputs.major_version) || '' }}
            ${{ steps.extract_tag.outputs.is_official == 'true' && format('{0}/{1}:alpine-{2}', env.REGISTRY, env.IMAGE_NAME, steps.extract_tag.outputs.major_version) || '' }}
          build-args: |
            BASE_IMAGE=alpine
            VERSION=${{ steps.extract_tag.outputs.tag }}
            RELEASE=${{ steps.get_sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Docker Scout vulnerability scanner
        id: scout_scan
        uses: docker/scout-action@v1.24.0
        with:
          command: 'cves'
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}'
          only-severities: 'critical,high'
          exit-code: true
          only-fixed: true
          sarif-file: 'docker-scout-results.sarif'

      - name: Upload Docker Scout scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('docker-scout-results.sarif') != ''
        with:
          sarif_file: 'docker-scout-results.sarif'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}'
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v5
        with:
          name: 'sbom-${{ steps.extract_tag.outputs.tag }}'
          path: 'sbom.cyclonedx.json'
          retention-days: 90

      # The helm-charts steps below run only for an official release whose
      # image was built and pushed and passed both the Trivy and Docker Scout
      # gates. They run even if a later step (e.g. SBOM) fails.
      - name: Generate helm-charts app token
        id: app_token
        if: >-
          !cancelled() &&
          steps.extract_tag.outputs.is_official == 'true' &&
          steps.build.outcome == 'success' &&
          steps.trivy_scan.outcome == 'success' &&
          steps.scout_scan.outcome == 'success'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.KUBEXAUTOMATION_APP_ID }}
          private-key: ${{ secrets.KUBEXAUTOMATION_APP_PRIVATE_KEY }}
          owner: densify-dev
          repositories: helm-charts

      - name: Open helm-charts PR to update the data collection image tag
        if: >-
          !cancelled() &&
          steps.extract_tag.outputs.is_official == 'true' &&
          steps.build.outcome == 'success' &&
          steps.trivy_scan.outcome == 'success' &&
          steps.scout_scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          TAG: ${{ steps.extract_tag.outputs.tag }}
          CHARTS_REPO: densify-dev/helm-charts
          CHART_DIR: charts/container-optimization-data-forwarder
        run: |
          set -euo pipefail
          branch="update/container-optimization-data-forwarder-${TAG}"
          work_dir="${RUNNER_TEMP}/helm-charts"

          # Create the branch on helm-charts from master (reset it to master if
          # a previous run of this tag already created it).
          master_sha=$(gh api "repos/${CHARTS_REPO}/git/ref/heads/master" --jq .object.sha)
          if gh api "repos/${CHARTS_REPO}/git/ref/heads/${branch}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${CHARTS_REPO}/git/refs/heads/${branch}" -f sha="${master_sha}" -F force=true > /dev/null
          else
            gh api "repos/${CHARTS_REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="${master_sha}" > /dev/null
          fi

          # Check the branch out outside this repo's workspace
          git clone --quiet --depth 1 --branch "${branch}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${CHARTS_REPO}.git" "${work_dir}"
          cd "${work_dir}/${CHART_DIR}"

          # Patch-bump the chart version
          current_version=$(sed -n -E 's/^version: *//p' Chart.yaml)
          if [[ ! "${current_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::unexpected chart version format: ${current_version}"
            exit 1
          fi
          next_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          sed -i -E "s/^version: .*/version: ${next_version}/" Chart.yaml

          # images.dataCollection.specificTag in values.yaml
          sed -i -E "/^  dataCollection:/,/^  [^ ]/ s/^(    specificTag: ).*/\1\"${TAG}\"/" values.yaml
          # Default value of the images.dataCollection.specificTag row in README.md
          sed -i -E "/^\| \`images\.dataCollection\.specificTag\`/ s/\`[^\`]*\` \|\$/\`${TAG}\` |/" README.md

          grep -q "^version: ${next_version}\$" Chart.yaml
          grep -q "^    specificTag: \"${TAG}\"\$" values.yaml
          grep -q "^| \`images\.dataCollection\.specificTag\`.*| \`${TAG}\` |\$" README.md
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          expected="${CHART_DIR}/Chart.yaml ${CHART_DIR}/README.md ${CHART_DIR}/values.yaml "
          if [[ "${changed}" != "${expected}" ]]; then
            echo "::error::unexpected file set changed: ${changed}"
            exit 1
          fi

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit --quiet -am "Update container-optimization-data-forwarder image to ${TAG}"
          git push --quiet origin "HEAD:${branch}"

          title="Update container-optimization-data-forwarder image to ${TAG}"
          body=$(cat <<BODY
          This PR was created automatically by the ${GITHUB_REPOSITORY} release workflow after image ${TAG} was built, pushed and passed the Trivy and Docker Scout scans.

          Changes:
          - Set \`images.dataCollection.specificTag\` to \`${TAG}\` in values.yaml and README.md
          - Bumped container-optimization-data-forwarder chart to ${next_version}

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          BODY
          )
          existing=$(gh pr list --repo "${CHARTS_REPO}" --head "${branch}" --state open --json number --jq '.[0].number // empty')
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --repo "${CHARTS_REPO}" --title "${title}" --body "${body}"
            echo "updated PR #${existing}"
          else
            gh pr create --repo "${CHARTS_REPO}" --base master --head "${branch}" --title "${title}" --body "${body}"
          fi
