name: Build and Push Docker Images

on:
  push:
    tags:
      - '*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: densify/container-optimization-data-forwarder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Extract tag name and determine if official release
        id: extract_tag
        run: |
          tag=${GITHUB_REF#refs/tags/}
          # remove leading 'v' from semver tags (e.g. v4.2.3-alpha -> 4.2.3-alpha)
          tag=$(echo "${tag}" | sed -E 's/^v([0-9]+.*)$/\1/')
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          
          # Check if this is an official release (not alpha, beta, rc, etc.)
          if [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_official=true" >> $GITHUB_OUTPUT
            # Extract major version (e.g., 4.2.2 -> 4)
            major_version=$(echo "${tag}" | sed -E 's/^([0-9]+)\.[0-9]+\.[0-9]+$/\1/')
            echo "major_version=${major_version}" >> $GITHUB_OUTPUT
          else
            echo "is_official=false" >> $GITHUB_OUTPUT
            echo "major_version=" >> $GITHUB_OUTPUT
          fi

      - name: Get commit SHA
        id: get_sha
        run: echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@v5.7.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=alpine-${{ steps.extract_tag.outputs.tag }}

      - name: Build and load Docker image locally
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          load: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpine-${{ steps.extract_tag.outputs.tag }}
            ${{ steps.extract_tag.outputs.is_official == 'true' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.extract_tag.outputs.major_version) || '' }}
            ${{ steps.extract_tag.outputs.is_official == 'true' && format('{0}/{1}:alpine-{2}', env.REGISTRY, env.IMAGE_NAME, steps.extract_tag.outputs.major_version) || '' }}
          build-args: |
            BASE_IMAGE=alpine
            VERSION=${{ steps.extract_tag.outputs.tag }}
            RELEASE=${{ steps.get_sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save each platform for scanning
        id: save
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
        run: |
          for arch in amd64 arm64; do
            docker image save --platform "linux/$arch" --output "$RUNNER_TEMP/$arch.tar" "$IMAGE"
          done

      - name: Install Docker Scout CLI
        id: scout_install
        run: |
          # Use the direct release URL to avoid the action's anonymous GitHub API download.
          archive="$RUNNER_TEMP/docker-scout.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/docker/scout-cli/releases/download/v1.29.0/docker-scout_1.29.0_linux_amd64.tar.gz
          printf '%s  %s\n' '9157cdc9372b478a8cd51dd53f5e9c74a7e34056ea291c65520bf76016fa72f4' "$archive" | sha256sum --check
          plugins="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          mkdir -p "$plugins"
          tar -xzf "$archive" -C "$plugins" docker-scout
          docker scout version

      - name: Scan linux/amd64 with Trivy and Docker Scout
        uses: ./.github/actions/scan-image
        with:
          arch: amd64

      - name: Scan linux/arm64 with Trivy and Docker Scout
        if: ${{ !cancelled() && steps.save.outcome == 'success' && steps.scout_install.outcome == 'success' }}
        uses: ./.github/actions/scan-image
        with:
          arch: arm64

      - name: Push scanned Docker image
        id: push
        # The fresh Docker daemon has only the release tags built above for this repository.
        run: docker image push --all-tags "$REGISTRY/$IMAGE_NAME"

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}'
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: 'sbom-${{ steps.extract_tag.outputs.tag }}'
          path: 'sbom.cyclonedx.json'
          retention-days: 90

      # The helm-charts steps below run only for an official release whose
      # image was built and pushed and passed both the Trivy and Docker Scout
      # gates. They run even if a later step (e.g. SBOM) fails.
      - name: Generate helm-charts app token
        id: app_token
        if: >-
          !cancelled() &&
          steps.extract_tag.outputs.is_official == 'true' &&
          steps.push.outcome == 'success'
        uses: actions/create-github-app-token@v3.4.0
        with:
          app-id: ${{ secrets.KUBEXAUTOMATION_APP_ID }}
          private-key: ${{ secrets.KUBEXAUTOMATION_APP_PRIVATE_KEY }}
          owner: densify-dev
          repositories: helm-charts

      - name: Open helm-charts PR to update the data collection image tag
        if: ${{ !cancelled() && steps.app_token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          TAG: ${{ steps.extract_tag.outputs.tag }}
          MAJOR_VERSION: ${{ steps.extract_tag.outputs.major_version }}
          CHARTS_REPO: densify-dev/helm-charts
          CHART_DIR: charts/container-optimization-data-forwarder
        run: ./.github/scripts/update-helm-chart-tag.sh
